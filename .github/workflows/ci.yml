name: ForgetFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --sync

      - name: Record CI provenance
        run: poetry run python scripts/record_ci_provenance.py --output ci/ci_provenance.json

      - name: Validate Poetry project
        run: poetry check

      - name: Validate workflow YAML
        run: poetry run python scripts/validate_workflows.py

      - name: Check source integrity
        run: poetry run python scripts/check_source_integrity.py

      - name: Compile source
        run: poetry run python -m compileall marble experiments

      - name: Import contracts
        run: |
          poetry run python -c "from marble.firewall.types import ForgetRecord, MessageEnvelope, DetectorResult, FirewallDecision"
          poetry run python -c "from marble.firewall.registry import ForgetLedger"
          poetry run python -c "from marble.firewall.detectors import HybridDetector"
          poetry run python -c "from marble.firewall.history import RecipientHistory, ReconstructionChecker"
          poetry run python -c "from marble.firewall.policy import ForgetPolicy"
          poetry run python -c "from marble.firewall.flow_gate import FlowGate"
          poetry run python -c "from marble.firewall.contamination import ContaminationTracker"
          poetry run python -c "from experiments.trustparadox_u.runner import run_episode"

      - name: Ruff lint
        run: |
          mkdir -p ci
          poetry run ruff check marble experiments tests scripts 2>&1 | tee ci/ruff_check.txt

      - name: Ruff format
        run: |
          mkdir -p ci
          poetry run ruff format --check marble experiments tests scripts 2>&1 | tee ci/ruff_format.txt

      - name: Mypy
        run: |
          mkdir -p ci
          poetry run mypy marble experiments 2>&1 | tee ci/mypy.txt

      - name: Tests
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: |
          mkdir -p ci
          poetry run pytest -q -m "not integration" --junitxml=ci/junit_non_integration.xml

      - name: Integration tests
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: |
          mkdir -p ci
          poetry run pytest -q -m integration --junitxml=ci/junit_integration.xml

      - name: Architecture contract tests
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run pytest tests/test_architecture_contract.py -q

      - name: Firewall tests
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run pytest tests/firewall -q

      - name: Config tests
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run pytest tests/trustparadox_u/test_config.py -q

      - name: Embedding tests
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run pytest tests/trustparadox_u/test_embedding.py -q

      - name: Attack tests
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run pytest tests/trustparadox_u/test_attacks.py -q

      - name: Evaluator tests
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run pytest tests/trustparadox_u/test_evaluator.py -q

      - name: Metric contract tests
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run pytest tests/trustparadox_u/test_metric_contracts.py -q

      - name: End-to-end tests
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run pytest tests/trustparadox_u/test_end_to_end.py -q

      - name: Runner tests
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run pytest tests/trustparadox_u/test_runner.py -q

      - name: Result audit tests
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run pytest tests/trustparadox_u/test_result_audit.py -q

      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence
          path: ci/
          retention-days: 90

  assertion-suite:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --sync

      - name: Run assertion suite
        continue-on-error: true  # Diagnostic suite (non-blocking): 5/10 cases passing, 0 consistency/audit failures
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run python scripts/run_assertion_suite.py --output-dir results/assertion_suite

      - name: Record CI provenance
        if: always()
        run: |
          poetry run python scripts/record_ci_provenance.py \
            --output results/assertion_suite/ci_provenance.json

      - name: Upload assertion results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assertion-suite-results
          path: results/assertion_suite/
          retention-days: 90

  single-target-smoke:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --sync

      - name: Run single-target smoke
        id: single_smoke
        continue-on-error: true  # Execution collects diagnostics; validation below is blocking (P0 #4)
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run python scripts/run_single_target_smoke.py --output-dir results/single_target_smoke --mode diagnostic

      - name: Validate single-target smoke
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: |
          poetry run python scripts/validate_smoke_result.py \
            --result-dir results/single_target_smoke \
            --require-audit-valid \
            --require-manifest-valid \
            --require-all-assertions \
            --require-directional-checks \
            --require-research-valid

      - name: Record CI provenance
        if: always()
        run: |
          poetry run python scripts/record_ci_provenance.py \
            --output results/single_target_smoke/ci_provenance.json

      - name: Upload single-target results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-target-smoke-results
          path: results/single_target_smoke/
          retention-days: 90

  multi-target-smoke:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --sync

      - name: Run multi-target smoke
        id: multi_smoke
        continue-on-error: true  # Execution collects diagnostics; validation below is blocking (P0 #4)
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: poetry run python scripts/run_multi_target_smoke.py --output-dir results/multi_target_smoke --mode diagnostic

      - name: Validate multi-target smoke
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: |
          poetry run python scripts/validate_smoke_result.py \
            --result-dir results/multi_target_smoke \
            --require-audit-valid \
            --require-manifest-valid \
            --require-all-assertions \
            --require-directional-checks \
            --require-research-valid

      - name: Record CI provenance
        if: always()
        run: |
          poetry run python scripts/record_ci_provenance.py \
            --output results/multi_target_smoke/ci_provenance.json

      - name: Upload multi-target results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-target-smoke-results
          path: results/multi_target_smoke/
          retention-days: 90

  trustparadox-u:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --sync

      - name: Run TrustParadox-U pipeline
        continue-on-error: true  # Evidence artifact; does not block certification
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: |
          poetry run python scripts/generate_trustparadox_u_results.py \
            --output-dir results/trustparadox_u \
            --commit "${{ github.sha }}"

      - name: Record CI provenance
        if: always()
        run: |
          poetry run python scripts/record_ci_provenance.py \
            --output results/trustparadox_u/ci_provenance.json

      - name: Upload TrustParadox-U results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustparadox-u-results
          path: results/trustparadox_u/
          retention-days: 90

  certify:
    runs-on: ubuntu-latest
    needs:
      - validate
      - assertion-suite
      - single-target-smoke
      - multi-target-smoke
      - trustparadox-u
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --sync

      - name: Download single-target results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: single-target-smoke-results
          path: results/single_target_smoke

      - name: Download multi-target results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: multi-target-smoke-results
          path: results/multi_target_smoke

      - name: Download TrustParadox-U results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trustparadox-u-results
          path: results/trustparadox_u

      - name: Download assertion-suite results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: assertion-suite-results
          path: results/assertion_suite

      - name: Record provenance and repository state
        run: |
          poetry run python scripts/record_ci_provenance.py \
            --output results/provenance/ci_provenance.json \
            --repository-state results/provenance/repository_state.json \
            --commit "${{ github.sha }}" \
            --clean

      # Section 18 ordering: (1) artifacts already generated above,
      # (2) independently recompute metrics, (3) validate artifacts,
      # (4) re-run audit gates, (5) checksums, (6) certification.
      - name: Independently recompute metrics
        id: verify
        continue-on-error: true
        run: poetry run python scripts/verify_metrics.py --results-dir results

      - name: Validate cross-artifact consistency
        id: consistency
        continue-on-error: true
        run: poetry run python scripts/validate_consistency.py --results-dir results

      - name: Re-validate single-target smoke (audit gate)
        id: reval_single
        continue-on-error: true
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: |
          poetry run python scripts/validate_smoke_result.py \
            --result-dir results/single_target_smoke \
            --require-audit-valid \
            --require-manifest-valid \
            --require-all-assertions \
            --require-directional-checks \
            --require-research-valid

      - name: Re-validate multi-target smoke (audit gate)
        id: reval_multi
        continue-on-error: true
        env:
          FORGETFLOW_TEST_MODE: "1"
        run: |
          poetry run python scripts/validate_smoke_result.py \
            --result-dir results/multi_target_smoke \
            --require-audit-valid \
            --require-manifest-valid \
            --require-all-assertions \
            --require-directional-checks \
            --require-research-valid

      - name: Write CI manifest
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          ASSERTION_RESULT: ${{ needs.assertion-suite.result }}
          SINGLE_RESULT: ${{ needs.single-target-smoke.result }}
          MULTI_RESULT: ${{ needs.multi-target-smoke.result }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          CONSISTENCY_OUTCOME: ${{ steps.consistency.outcome }}
        run: |
          map_result() { if [ "$1" = "success" ]; then echo PASS; else echo FAIL; fi; }
          poetry run python scripts/write_ci_manifest.py \
            --output results/complete_results_manifest.json \
            --tested-commit "${{ github.sha }}" \
            --phase static_checks="$(map_result "$VALIDATE_RESULT")" \
            --phase test_suite="$(map_result "$VALIDATE_RESULT")" \
            --phase assertion_suite="$(map_result "$ASSERTION_RESULT")" \
            --phase single_target_smoke="$(map_result "$SINGLE_RESULT")" \
            --phase multi_target_smoke="$(map_result "$MULTI_RESULT")" \
            --phase independent_verification="$(map_result "$VERIFY_OUTCOME")" \
            --phase consistency_validation="$(map_result "$CONSISTENCY_OUTCOME")"

      - name: Generate checksums and certification
        id: certify
        continue-on-error: true
        run: |
          poetry run python scripts/generate_certification.py \
            --results-dir results \
            --tested-commit "${{ github.sha }}"

      - name: Verify checksums
        id: checksum_check
        continue-on-error: true
        run: |
          cd results
          sha256sum --check certification/checksums.sha256

      - name: Upload certification and checksums
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certification-checksums
          path: |
            results/certification/
            results/complete_results_manifest.json
            results/provenance/
            results/ci/
          retention-days: 90
